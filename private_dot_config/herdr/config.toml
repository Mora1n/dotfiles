onboarding = false
[keys]
prefix = "alt+h"
navigate_workspace_up = "shift+k"
navigate_workspace_down = "shift+j"
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+a"
new_workspace = "prefix+w"
close_workspace = "prefix+shift+w"
rename_workspace = "prefix+$"
previous_workspace = ["prefix+(", "prefix+shift+k"]
next_workspace = ["prefix+)", "prefix+shift+j"]
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
close_tab = "prefix+ampersand"
edit_scrollback = ["prefix+v", "prefix+["]
focus_pane_left = ["prefix+h", "prefix+ctrl+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+ctrl+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+ctrl+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+ctrl+l", "prefix+right"]
swap_pane_up = "prefix+{"
swap_pane_down = "prefix+}"
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
split_vertical = ["prefix+|", "prefix+%"]
split_horizontal = ["prefix+minus", "prefix+\""]
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "open Sesh workspace picker"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
  [
    { token = "state_icon", bold = true, dim = false },
    { token = "agent", fg = "#8be9fd", bold = true, dim = false },
  ],
  [
    { token = "workspace", fg = "#f8f8f2" },
    { token = "tab", fg = "#bd93f9" },
  ],
]

[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "system"

[update]
channel = "preview"
