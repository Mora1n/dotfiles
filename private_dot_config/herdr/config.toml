[keys]
prefix = "alt+z"
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+a"
new_workspace = "prefix+s"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
edit_scrollback = ["prefix+v", "prefix+["]
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
cycle_pane_next = "prefix+o"
last_pane = "prefix+tab"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+b"

[ui.sound]
enabled = false

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"

[theme]
name = "dracula"
auto_switch = false
