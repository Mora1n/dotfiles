1\Command="const notificationTimeout = Number(config('item_popup_interval')) * 1000;\n\nconst textData = data(mimeText);\n\n// Ignore HTML clipboard data.\n// This command only checks plain-text clipboard content.\nif (data(mimeHtml).length !== 0) abort();\n\n// Avoid scanning very short or excessively large clipboard content.\nif (textData.length < 16 || textData.length > 4096) abort();\n\nconst text = str(textData).trim();\n\nif (text.length < 16) abort();\n\n\n// -----------------------------------------------------------------------------\n// Known secret/token formats\n// -----------------------------------------------------------------------------\n\nconst tokenPatterns = [\n    /sk-[A-Za-z0-9_-]{16,}/,                     // OpenAI / compatible API tokens\n    /sk-ant-[A-Za-z0-9_-]{16,}/,                 // Anthropic\n    /AIza[0-9A-Za-z_-]{20,}/,                    // Google API key\n    /ya29\\.[0-9A-Za-z_-]{20,}/,                  // Google OAuth token\n    /hf_[A-Za-z0-9]{16,}/,                       // Hugging Face\n    /xai-[A-Za-z0-9_-]{16,}/,                    // xAI\n    /r8_[A-Za-z0-9_-]{16,}/,                     // Replicate\n    /gsk_[A-Za-z0-9]{16,}/,                      // Groq\n\n    /(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}/, // GitHub legacy tokens\n    /github_pat_[A-Za-z0-9_]{20,}/,              // GitHub fine-grained PAT\n    /glpat-[A-Za-z0-9_-]{16,}/,                  // GitLab PAT\n\n    /(?:AKIA|ASIA)[0-9A-Z]{16}/,                 // AWS Access Key ID\n\n    /xox[baprs]-[A-Za-z0-9-]{10,}/,              // Slack token\n\n    /(?:sk|pk|rk)_(?:live|test)_[A-Za-z0-9]{16,}/, // Stripe\n\n    /npm_[A-Za-z0-9]{20,}/,                      // npm access token\n];\n\n\n// -----------------------------------------------------------------------------\n// Private keys\n// -----------------------------------------------------------------------------\n\nconst privateKeyPatterns = [\n    /-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----/,\n    /-----BEGIN PGP PRIVATE KEY BLOCK-----/,\n];\n\n\n// -----------------------------------------------------------------------------\n// AES keys represented as raw hexadecimal strings\n//\n// AES-128: 32 hex chars\n// AES-192: 48 hex chars\n// AES-256: 64 hex chars\n// -----------------------------------------------------------------------------\n\nconst aesHex = /^(?:[0-9a-fA-F]{32}|[0-9a-fA-F]{48}|[0-9a-fA-F]{64})$/;\n\n\n// -----------------------------------------------------------------------------\n// Base64-looking secrets\n// -----------------------------------------------------------------------------\n\nfunction looksLikeBase64Secret(s) {\n    // Typical encoded cryptographic keys are at least this long.\n    if (s.length < 24 || s.length > 256) return false;\n\n    // Must be valid-looking Base64.\n    if (!/^[A-Za-z0-9+/]+={0,2}$/.test(s)) return false;\n\n    // Require Base64-specific characters to reduce false positives\n    // for ordinary alphanumeric identifiers.\n    return /[+/=]/.test(s);\n}\n\n\n// -----------------------------------------------------------------------------\n// Strong password-like strings\n// -----------------------------------------------------------------------------\n\nfunction looksLikePassword(s) {\n    if (s.length < 16 || s.length > 128) return false;\n    if (/\\s/.test(s)) return false;\n\n    const hasLower = /[a-z]/.test(s);\n    const hasUpper = /[A-Z]/.test(s);\n    const hasDigit = /\\d/.test(s);\n    const hasSymbol = /[^A-Za-z0-9]/.test(s);\n\n    // Require at least three character classes.\n    const classes =\n        Number(hasLower) +\n        Number(hasUpper) +\n        Number(hasDigit) +\n        Number(hasSymbol);\n\n    return classes >= 3;\n}\n\n\n// -----------------------------------------------------------------------------\n// JWT\n// -----------------------------------------------------------------------------\n\nfunction looksLikeJwt(s) {\n    return /^eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$/.test(s);\n}\n\n\n// -----------------------------------------------------------------------------\n// URLs\n// -----------------------------------------------------------------------------\n\nfunction isPlainUrl(s) {\n    if (!/^https?:\\/\\//i.test(s)) return false;\n\n    // URLs containing obvious credentials or tokens must still be treated\n    // as secrets.\n    if (/^https?:\\/\\/[^/\\s:@]+:[^/\\s@]+@/i.test(s)) return false;\n\n    if (\n        /[?&](?:token|access_token|api_key|apikey|key|secret|password|passwd|signature|sig)=/i.test(s)\n    ) {\n        return false;\n    }\n\n    return true;\n}\n\n\n// -----------------------------------------------------------------------------\n// Secret detection\n// -----------------------------------------------------------------------------\n\nfunction matchesAny(patterns, s) {\n    for (const re of patterns) {\n        if (re.test(s)) return true;\n    }\n\n    return false;\n}\n\nlet isSecret =\n    matchesAny(tokenPatterns, text) ||\n    matchesAny(privateKeyPatterns, text) ||\n    aesHex.test(text) ||\n    looksLikeJwt(text) ||\n    looksLikeBase64Secret(text) ||\n    looksLikePassword(text);\n\n\n// Ordinary URLs are intentionally kept in clipboard history.\n//\n// IMPORTANT:\n// This check happens after explicit secret detection so that URLs containing\n// known API tokens are still blocked.\nif (!isSecret && isPlainUrl(text)) abort();\n\nif (!isSecret) abort();\n\nnotification(\n    '.title', 'Secret excluded from clipboard history',\n    '.id', 'secrets',\n    '.icon', '',\n    '.time', notificationTimeout,\n);\n\nignore();"
