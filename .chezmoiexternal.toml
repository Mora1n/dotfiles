{{- $repo := "joshmedeski/sesh" -}}
{{- $asset := "sesh_Linux_x86_64.tar.gz" -}}
{{- $archiveURL := gitHubLatestReleaseAssetURL $repo $asset -}}
{{- $checksumsURL := gitHubLatestReleaseAssetURL $repo "sesh_*_checksums.txt" -}}
{{- $checksums := output "curl" "-fsSL" $checksumsURL -}}
{{- $checksumLine := regexFind `(?m)^[0-9a-f]{64}  sesh_Linux_x86_64[.]tar[.]gz$` $checksums -}}
{{- if not $checksumLine -}}
{{-   fail "sesh Linux x86_64 checksum not found in latest release" -}}
{{- end -}}
{{- $sha256 := index (splitList "  " $checksumLine) 0 }}

[".local/bin/sesh"]
type = "archive-file"
url = {{ $archiveURL | quote }}
path = "sesh"
executable = true
checksum.sha256 = {{ $sha256 | quote }}
